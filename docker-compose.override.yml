# Local development override — applied automatically by `docker compose up`.
#
# It bind-mounts the working tree over the image so edits are live, and turns on
# PHP error display. Delete this file (or run `docker compose -f
# docker-compose.yml up`) to run the immutable image built by the Dockerfile.
#
# NOTE: mongod keeps authentication enabled here on purpose. IdaeConnect always
# builds a `mongodb://user:pass@host` URI, so a --noauth mongod would reject the
# handshake.

services:
  app:
    volumes:
      - ./:/var/www/html:cached
      # Keep the vendor/ installed inside the image instead of the host one.
      - /var/www/html/web/bin/vendor
    environment:
      PHP_DISPLAY_ERRORS: "1"
